name: Product site
on:
  pull_request:
  push:
    branches: [master, codex/opcos-content-release]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docs/tools/product-site/build.mjs
      - run: node docs/tools/product-site/check.mjs
      - run: git diff --exit-code -- docs/sites
